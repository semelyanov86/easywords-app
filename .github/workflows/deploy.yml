name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SITE_USER: site_easywords
      RELEASE_DIR: /var/www/easywords/current
      OCTANE_SERVICE: octane-easywords
      PHP_FPM_SERVICE: php8.5-fpm
      QUEUE_GROUP: queue-easywords

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          PORT="${DEPLOY_SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Build & release on server
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          ssh -p "$PORT" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
              "sudo -u $SITE_USER -H RELEASE_DIR=$RELEASE_DIR bash -se" <<'REMOTE'
            set -euo pipefail
            cd "$RELEASE_DIR"

            php artisan down --render="errors::503" --retry=15 || true

            git fetch --prune origin
            git reset --hard origin/main

            composer install --no-interaction --no-dev --prefer-dist --optimize-autoloader

            php artisan migrate --force

            php artisan optimize:clear

            php artisan wayfinder:generate --with-form

            npm ci --no-audit --no-fund
            npm run build

            php artisan optimize
            php artisan event:cache

            php artisan up
          REMOTE

      - name: Reload Octane, PHP-FPM and queue workers
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          ssh -p "$PORT" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
              "OCTANE_SERVICE=$OCTANE_SERVICE PHP_FPM_SERVICE=$PHP_FPM_SERVICE QUEUE_GROUP=$QUEUE_GROUP bash -se" <<'REMOTE'
            set -euo pipefail
            # The site serves through Octane/RoadRunner since 2026-08-22, and a
            # RoadRunner worker keeps the booted application — code and the
            # cached config from `artisan optimize` above — in memory until it
            # is told to reload. Without this the deploy above lands on disk
            # while every request keeps being answered by the previous release.
            # ExecReload on the unit is `artisan octane:reload`, which drains
            # workers gracefully, so there is no downtime and no need to
            # restart the service.
            sudo systemctl reload "$OCTANE_SERVICE"
            # The php-fpm pool is no longer in the request path (nginx proxies
            # to RoadRunner) but still exists as a fallback and for CLI work,
            # so keep its opcache in sync too.
            sudo systemctl reload "$PHP_FPM_SERVICE"
            sudo supervisorctl restart "$QUEUE_GROUP:*"
          REMOTE
